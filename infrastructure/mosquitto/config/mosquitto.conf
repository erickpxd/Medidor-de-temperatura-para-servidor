persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_dest file /mosquitto/log/mosquitto.log

listener 1883 0.0.0.0
# Local development only. Production guidance in docs/security.md enables
# password_file, per-device ACLs and a TLS listener on port 8883.
allow_anonymous true

connection_messages true
log_type error
log_type warning
log_type notice
log_timestamp true
